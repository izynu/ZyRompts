[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zyrompts"
version = "0.1.0"
description = "Modular multi-agent workflow framework for AI coding agents"
readme = { text = "Deterministic workflow controls for AI coding agents: one canonical skill library, rendered to Claude Code, Gemini, Copilot, Codex and OpenCode.", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZyRompts contributors" }]
keywords = ["agents", "workflow", "planning", "critique", "prompt-engineering", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
zyrompts = "zyrompts.cli:main"

[tool.setuptools]
packages = ["zyrompts"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"
