[build-system]
# 77 is the floor for the SPDX `license = "MIT"` string form. 68 accepts the
# deprecated table form only, so a build env pinned to 68-76 would reject this.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zyrompts"
version = "0.1.0"
description = "Modular multi-agent workflow framework for AI coding agents"
# This distribution is the library, not a standalone install: the rules, skills
# and eval datasets are read from a repository checkout, so a wheel install
# needs ZYROMPTS_ROOT. `zyrompts validate` says so when the data is missing.
readme = { text = "Deterministic workflow controls for AI coding agents: one canonical skill library, rendered to Claude Code, Gemini, Copilot, Codex and OpenCode. Install with `pip install -e core` from a checkout; the data files live in the repository.", content-type = "text/markdown" }
requires-python = ">=3.9"
# An SPDX string, not a table: `license = { text = "..." }` is deprecated and
# setuptools refuses it from 2027-02-18. The classifier below is dropped for
# the same reason; the SPDX expression replaces it.
license = "MIT"
authors = [{ name = "ZyRompts contributors" }]
keywords = ["agents", "workflow", "planning", "critique", "prompt-engineering", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
zyrompts = "zyrompts.cli:main"

[tool.setuptools]
packages = ["zyrompts"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"
